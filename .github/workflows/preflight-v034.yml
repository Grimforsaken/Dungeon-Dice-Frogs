name: Preflight Dungeon Dice Frogs 0.3.4

on:
  push:
    branches:
      - update-0.3.4-full-content
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore stable development signing key
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode signing/stable-debug.keystore.b64 > app/stable-debug.keystore
          keytool -list -keystore app/stable-debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Apply source preflight
        run: python3 patch_build_v034.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify stable APK signer
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload preflight APK
        uses: actions/upload-artifact@v4
        with:
          name: DungeonDiceFrogs-0.3.4-preflight
          path: app/build/outputs/apk/debug/app-debug.apk
