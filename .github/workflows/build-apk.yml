name: Build Dungeon Dice Frogs APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "DungeonDiceFrogs-latest.apk"
      - "latest-run.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Apply source preflight
        run: python3 patch_build.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publish latest APK
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk DungeonDiceFrogs-latest.apk
          printf '%s\n' "$GITHUB_RUN_ID" > latest-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DungeonDiceFrogs-latest.apk latest-run.txt
          git commit -m "Build Dungeon Dice Frogs APK [skip ci]" || true
          git push origin HEAD:main || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DungeonDiceFrogs-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
